# Supply-chain policy for ZenShare.
#
# This file is the mechanism that turns "pure Rust" from a README claim into a
# build failure. If someone reaches for rusqlite, zstd-sys or OpenSSL in a hurry,
# CI stops them with a reason instead of a code review comment.
#
# Run: cargo deny check

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[bans]
multiple-versions = "warn"
# Path dependencies inside this workspace carry no version requirement by
# design — they are built from the same commit, so there is nothing to pin.
# Denying wildcards here would only flag `foo = { path = "../foo" }`.
wildcards = "allow"

deny = [
  # Webview / app frameworks. The entire point of this project is not being these.
  { name = "tauri" },
  { name = "tauri-build" },
  { name = "wry" },
  { name = "webview2-com" },
  { name = "webkit2gtk" },

  # C databases.
  { name = "rusqlite" },
  { name = "libsqlite3-sys" },
  { name = "duckdb" },

  # C compression.
  { name = "zstd-sys" },
  { name = "libz-sys" },
  { name = "bzip2-sys" },
  { name = "xz2" },

  # C TLS. ring is the single approved exception.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },

  # C GUI toolkits.
  { name = "gtk-sys" },
  { name = "glib-sys" },
  { name = "gobject-sys" },
  { name = "webkit2gtk-sys" },

  # C allocators.
  { name = "mimalloc" },
  { name = "mimalloc-sys" },
  { name = "jemallocator" },
  { name = "jemalloc-sys" },

  # C crypto outside the approved TLS path.
  { name = "libsodium-sys" },
  { name = "sodiumoxide" },
]

# No skip list. If two versions of a crate show up, the fix is to resolve the
# duplicate, not to silence it. `multiple-versions` is a warning, so it informs
# without blocking.

[licenses]
# Everything below is permissive. Copyleft identifiers appear in the tree only as
# OR-alternatives (e.g. `Apache-2.0 OR GPL-2.0-only`), where we always take the
# permissive branch — so GPL and LGPL are deliberately absent from this list.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "BSL-1.0",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "OFL-1.1",
  # epaint ships the Ubuntu font for default glyph coverage; we replace the
  # fonts at startup but the crate is still linked.
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
