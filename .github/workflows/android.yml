name: Android

on:
  push:
    branches: [master, main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
      - ".github/scripts/build-apk.sh"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Locate the NDK
        run: |
          # The runner ships an NDK; cargo-ndk needs to be told where.
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            latest="$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$latest" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        run: bash .github/scripts/build-apk.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
