[package]
name = "zs-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zs-core = { path = "../zs-core" }
eframe.workspace = true
egui.workspace = true
async-channel.workspace = true
tracing.workspace = true

# Native file dialogs exist on desktop and nowhere else. Android needs the
# Storage Access Framework instead, which is a separate piece of work.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd.workspace = true
# Screen readers are a desktop concern, and eframe refuses this feature on
# Android. Enabling it only for non-Android targets keeps both sides honest.
eframe = { workspace = true, features = ["accesskit"] }

[lints]
workspace = true

[dev-dependencies]
# Headless rendering + snapshot comparison. Version-locked to our egui, so a
# bump to egui is a bump here in the same commit or the harness refuses to build.
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
